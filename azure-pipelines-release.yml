# OSM Address GeoParquet Manual GitHub Release Pipeline
# Downloads latest build artifacts from the addresses-parquet pipeline,
# extracts per-region files, generates release notes, and publishes a GitHub Release.
name: addresses-release-pipeline

trigger: none # Manual execution only

parameters:
- name: releaseTag
  displayName: 'GitHub Release Tag (e.g. v1.0.0)'
  type: string
  default: 'v1.0.0'
- name: releaseTitle
  displayName: 'GitHub Release Title'
  type: string
  default: 'OSM Address GeoParquet Release v1.0.0'
- name: specificBuildId
  displayName: 'Specific Build ID (optional: e.g. 248. Leave blank for latest build)'
  type: string
  default: ''
- name: isDraft
  displayName: 'Draft Release'
  type: boolean
  default: false
- name: isPreRelease
  displayName: 'Mark as Pre-release'
  type: boolean
  default: true

pool:
  vmImage: 'ubuntu-latest'

jobs:
- job: release
  displayName: 'Publish GitHub Release'
  timeoutInMinutes: 360
  steps:
  - checkout: self

  # Download build artifacts from addresses-parquet pipeline (definition 6)
  - task: DownloadPipelineArtifact@2
    displayName: 'Download build archives artifact'
    inputs:
      buildType: 'specific'
      project: 'f85b0393-1484-487a-b6d1-5120b54a70be'
      definition: '6'
      artifactName: 'addresses-parquet-archives'
      ${{ if ne(parameters.specificBuildId, '') }}:
        pipelineId: '${{ parameters.specificBuildId }}'
      ${{ if eq(parameters.specificBuildId, '') }}:
        buildVersionToDownload: 'latest'
      targetPath: '$(System.DefaultWorkingDirectory)/downloads'

  - task: Bash@3
    displayName: 'Prepare Release Assets & Summary Notes'
    inputs:
      targetType: 'inline'
      script: |
        set -e
        mkdir -p release-assets

        # 1. Global combined archive
        find downloads -name "addresses-parquet-all.tar.gz" -exec cp {} release-assets/ \;

        # 2. Continental archives
        find downloads -name "addresses-parquet-*.tar.gz" -exec cp {} release-assets/ \;

        # Check if tarball artifacts were found
        if [ ! -f "release-assets/addresses-parquet-all.tar.gz" ]; then
          echo "****************************************************************"
          echo " ERROR: No addresses-parquet-all.tar.gz artifact found in downloads!"
          echo ""
          echo " Cause:"
          echo "   The selected build of pipeline definition 6 (addresses-parquet)"
          echo "   failed or did not publish its final 'package' stage archives."
          echo ""
          echo " Solution:"
          echo "   Pass the specific successful Build ID (e.g. 248) into the"
          echo "   'specificBuildId' parameter when launching this release pipeline."
          echo "****************************************************************"
          exit 1
        fi

        # 3. Extract individual per-country GeoParquet files
        find downloads -name "addresses-parquet-all.tar.gz" | while read -r archive; do
          tar xfz "$archive" -C release-assets/
        done

        PARQUET_COUNT=$(find release-assets -name "*.parquet" | wc -l)
        if [ "$PARQUET_COUNT" -eq 0 ]; then
          echo "****************************************************************"
          echo " ERROR: No GeoParquet (.parquet) files were found in downloaded artifacts!"
          echo "****************************************************************"
          exit 1
        fi

        echo "[INFO] Found $PARQUET_COUNT GeoParquet file(s) for release."

        # Generate Release Notes Markdown
        cat <<EOF > release-notes.md
        ## OSM Address GeoParquet Release (${{ parameters.releaseTag }})

        Global ZSTD-compressed GeoParquet datasets containing address-tagged features (\`addr:housenumber\`, \`addr:street\`, \`addr:postcode\`, \`addr:city\`) extracted from OpenStreetMap.

        ### Dataset Schema & Attributes
        | Column | Type | Description |
        | :--- | :--- | :--- |
        | **\`street\`** | \`VARCHAR\` | Street name (\`addr:street\` or \`name\`) |
        | **\`number\`** | \`VARCHAR\` | House number (\`addr:housenumber\`) |
        | **\`postcode\`** | \`VARCHAR\` | Postal code (\`addr:postcode\`) |
        | **\`city\`** | \`VARCHAR\` | City / Municipality (\`addr:city\`) |
        | **\`geometry\`** | \`GEOMETRY\` | Point geometry (WGS84 EPSG:4326) |

        ### Download Assets
        - **\`addresses-parquet-all.tar.gz\`**: Global combined archive containing all $PARQUET_COUNT per-region GeoParquet files worldwide.
        - **\`addresses-parquet-<continent>.tar.gz\`**: Continental archives (Europe, Asia, Africa, North America, South America, Central America, Oceania).
        - **\`<CC>_<region>.addresses.parquet\`**: Individual per-region GeoParquet files for targeted single-country downloads.

        ---
        *Built with DuckDB spatial extension and ZSTD compression.*
        EOF

        ls -lh release-assets/
        cat release-notes.md

  - task: GitHubRelease@1
    displayName: 'Create GitHub Release'
    inputs:
      gitHubConnection: '3c34db30-d57b-42e2-a970-857bd932c6c0'
      repositoryName: '$(Build.Repository.Name)'
      action: 'create'
      target: '$(Build.SourceVersion)'
      tagSource: 'userSpecifiedTag'
      tag: '${{ parameters.releaseTag }}'
      title: '${{ parameters.releaseTitle }}'
      releaseNotesSource: 'filePath'
      releaseNotesFilePath: '$(System.DefaultWorkingDirectory)/release-notes.md'
      assets: |
        $(System.DefaultWorkingDirectory)/release-assets/*.tar.gz
        $(System.DefaultWorkingDirectory)/release-assets/*.parquet
      assetUploadMode: 'delete'
      isDraft: ${{ parameters.isDraft }}
      isPreRelease: ${{ parameters.isPreRelease }}
