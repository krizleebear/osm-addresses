    steps:
    - checkout: none

    - task: Bash@3
      displayName: 'Reclaim runner host disk space'
      inputs:
        targetType: 'inline'
        script: |
          echo "[INFO] Disk space before cleanup:"
          df -h /
          sudo systemctl stop docker 2>/dev/null || true
          sudo rm -rf \
            /var/lib/docker \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/local/share/boost \
            /opt/hostedtoolcache \
            /usr/share/swift \
            /usr/lib/jvm \
            /usr/local/julia \
            /usr/share/miniconda \
            /usr/local/share/powershell \
            /opt/microsoft/powershell \
            /usr/local/share/vcpkg \
            /usr/local/share/chromium \
            /usr/share/google-chrome \
            /opt/google/chrome \
            /usr/share/firefox \
            2>/dev/null || true
          sudo apt-get clean 2>/dev/null || true
          sudo rm -rf /var/cache/apt/archives /var/lib/apt/lists/* 2>/dev/null || true
          echo "[INFO] Disk space after cleanup:"
          df -h /

    # Download build artifacts from current pipeline run for this continent
    - task: DownloadPipelineArtifact@2
      displayName: 'Download GeoParquet artifacts ($(REGION_GROUP))'
      inputs:
        buildType: 'current'
        itemPattern: |
          $(ARTIFACT_PATTERNS)
        targetPath: '$(System.DefaultWorkingDirectory)/downloads'

    - task: DownloadPipelineArtifact@2
      displayName: 'Download release notes'
      inputs:
        buildType: 'current'
        artifact: 'release-notes'
        targetPath: '$(System.DefaultWorkingDirectory)/release-notes'

    - task: Bash@3
      displayName: 'Prepare Release Assets ($(REGION_GROUP))'
      env:
        PARAM_RELEASE_TAG: '${{ parameters.releaseTag }}'
        UPSTREAM_RELEASE_TAG: '$(RELEASE_TAG)'
      inputs:
        targetType: 'inline'
        script: |
          set -e
          mkdir -p release-assets

          find downloads -name "*.parquet" -exec mv {} release-assets/ \;
          rm -rf downloads

          PARQUET_COUNT=$(find release-assets -name "*.parquet" | wc -l)
          if [ "$PARQUET_COUNT" -eq 0 ]; then
            echo "[WARN] No GeoParquet files found for region group $(REGION_GROUP)."
          else
            echo "[INFO] Found $PARQUET_COUNT GeoParquet file(s) for region group $(REGION_GROUP)."
            ls -lh release-assets/
          fi

          # Resolve tag reliably
          TARGET_TAG="$UPSTREAM_RELEASE_TAG"
          if [ -z "$TARGET_TAG" ] || [ "$TARGET_TAG" = "auto" ] || [ "$TARGET_TAG" = "null" ]; then
            TARGET_TAG="$PARAM_RELEASE_TAG"
          fi
          if [ -z "$TARGET_TAG" ] || [ "$TARGET_TAG" = "auto" ]; then
            TARGET_TAG="$(Build.BuildNumber)"
          fi

          echo "[INFO] Using Release Tag: $TARGET_TAG"
          echo "##vso[task.setvariable variable=RESOLVED_TAG]$TARGET_TAG"

    - task: GitHubRelease@1
      displayName: 'Upload Assets to GitHub Release ($(REGION_GROUP))'
      inputs:
        gitHubConnection: '3c34db30-d57b-42e2-a970-857bd932c6c0'
        repositoryName: '$(Build.Repository.Name)'
        action: 'edit'
        target: '$(Build.SourceVersion)'
        tagSource: 'userSpecifiedTag'
        tag: '$(RESOLVED_TAG)'
        releaseNotesSource: 'filePath'
        releaseNotesFilePath: '$(System.DefaultWorkingDirectory)/release-notes/release-notes.md'
        assets: |
          $(System.DefaultWorkingDirectory)/release-assets/*.parquet
        assetUploadMode: 'replace'
        isDraft: ${{ parameters.isDraft }}
        isPreRelease: ${{ parameters.isPreRelease }}

    - task: Bash@3
      displayName: 'Cleanup workspace'
      condition: always()
      inputs:
        targetType: 'inline'
        script: |
          rm -rf $(System.DefaultWorkingDirectory)/*


