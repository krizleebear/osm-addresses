          bolivia:
            OSM_REGION: 'bolivia'
            PBF_URL: 'https://download.geofabrik.de/south-america/bolivia/bolivia-latest.osm.pbf'
            COUNTRY_CODE: 'BO'
          brazil:
            OSM_REGION: 'brazil'
            PBF_URL: 'https://download.geofabrik.de/south-america/brazil/brazil-latest.osm.pbf'
            COUNTRY_CODE: 'BR'
          chile:
            OSM_REGION: 'chile'
            PBF_URL: 'https://download.geofabrik.de/south-america/chile/chile-latest.osm.pbf'
            COUNTRY_CODE: 'CL'
          colombia:
            OSM_REGION: 'colombia'
            PBF_URL: 'https://download.geofabrik.de/south-america/colombia/colombia-latest.osm.pbf'
            COUNTRY_CODE: 'CO'
          ecuador:
            OSM_REGION: 'ecuador'
            PBF_URL: 'https://download.geofabrik.de/south-america/ecuador/ecuador-latest.osm.pbf'
            COUNTRY_CODE: 'EC'
          guyana:
            OSM_REGION: 'guyana'
            PBF_URL: 'https://download.geofabrik.de/south-america/guyana/guyana-latest.osm.pbf'
            COUNTRY_CODE: 'GY'
          paraguay:
            OSM_REGION: 'paraguay'
            PBF_URL: 'https://download.geofabrik.de/south-america/paraguay/paraguay-latest.osm.pbf'
            COUNTRY_CODE: 'PY'
          peru:
            OSM_REGION: 'peru'
            PBF_URL: 'https://download.geofabrik.de/south-america/peru/peru-latest.osm.pbf'
            COUNTRY_CODE: 'PE'
          suriname:
            OSM_REGION: 'suriname'
            PBF_URL: 'https://download.geofabrik.de/south-america/suriname/suriname-latest.osm.pbf'
            COUNTRY_CODE: 'SR'
          uruguay:
            OSM_REGION: 'uruguay'
            PBF_URL: 'https://download.geofabrik.de/south-america/uruguay/uruguay-latest.osm.pbf'
            COUNTRY_CODE: 'UY'
          venezuela:
            OSM_REGION: 'venezuela'
            PBF_URL: 'https://download.geofabrik.de/south-america/venezuela/venezuela-latest.osm.pbf'
            COUNTRY_CODE: 'VE'

    steps:

    - checkout: self

    - task: Bash@3
      target: host
      displayName: 'Reclaim runner host disk space'
      inputs:
        targetType: 'inline'
        script: |
          echo "[INFO] Disk space before cleanup:"
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            /opt/hostedtoolcache \
            2>/dev/null || true
          echo "[INFO] Disk space after cleanup:"
          df -h /

    # Download cached PBF from the osm-download pipeline (definition 9: krizleebear.osm-download-pbf).
    # Never fetch directly from Geofabrik here — that is the download pipeline's job.
    # Download raw PBF from osm-download pipeline when skipOsmiumFilter is false
    - ${{ if or(eq(parameters.downloadBuildId, 'latest'), eq(parameters.downloadBuildId, 'auto')) }}:
      - task: DownloadPipelineArtifact@2
        enabled: true
        displayName: 'Download cached OSM PBF (from osm-download pipeline - latest)'
        condition: ${{ eq(parameters.skipOsmiumFilter, false) }}
        inputs:
          buildType: 'specific'
          project: 'f85b0393-1484-487a-b6d1-5120b54a70be'
          definition: '9'
          buildVersionToDownload: 'latest'
          artifactName: 'osm-data-$(OSM_REGION)'
          targetPath: '$(System.DefaultWorkingDirectory)'
    - ${{ if not(or(eq(parameters.downloadBuildId, 'latest'), eq(parameters.downloadBuildId, 'auto'))) }}:
      - task: DownloadPipelineArtifact@2
        enabled: true
        displayName: 'Download cached OSM PBF (from osm-download pipeline - build ${{ parameters.downloadBuildId }})'
        condition: ${{ eq(parameters.skipOsmiumFilter, false) }}
        inputs:
          buildType: 'specific'
          project: 'f85b0393-1484-487a-b6d1-5120b54a70be'
          pipeline: '9'
          buildId: '${{ parameters.downloadBuildId }}'
          artifactName: 'osm-data-$(OSM_REGION)'
          targetPath: '$(System.DefaultWorkingDirectory)'

    # Download pre-filtered PBF artifacts when skipOsmiumFilter is true
    - ${{ if and(ne(parameters.pbfBuildId, 'latest'), ne(parameters.pbfBuildId, 'auto'), ne(parameters.pbfBuildId, '')) }}:
      - task: DownloadPipelineArtifact@2
        enabled: true
        displayName: 'Download pre-filtered PBF artifacts (from addresses-parquet build ${{ parameters.pbfBuildId }})'
        condition: ${{ eq(parameters.skipOsmiumFilter, true) }}
        inputs:
          buildType: 'specific'
          project: 'f85b0393-1484-487a-b6d1-5120b54a70be'
          definition: '6'
          buildVersionToDownload: 'specific'
          pipelineId: '${{ parameters.pbfBuildId }}'
          allowFailedBuilds: true
          allowPartiallySucceededBuilds: true
          artifactName: 'osm-pbf-$(COUNTRY_CODE)-$(OSM_REGION)'
          targetPath: '$(System.DefaultWorkingDirectory)'
    - ${{ if or(eq(parameters.pbfBuildId, 'latest'), eq(parameters.pbfBuildId, 'auto'), eq(parameters.pbfBuildId, '')) }}:
      - task: DownloadPipelineArtifact@2
        enabled: true
        displayName: 'Download pre-filtered PBF artifacts (from addresses-parquet latest build)'
        condition: ${{ eq(parameters.skipOsmiumFilter, true) }}
        inputs:
          buildType: 'specific'
          project: 'f85b0393-1484-487a-b6d1-5120b54a70be'
          definition: '6'
          buildVersionToDownload: 'latest'
          allowFailedBuilds: true
          allowPartiallySucceededBuilds: true
          artifactName: 'osm-pbf-$(COUNTRY_CODE)-$(OSM_REGION)'
          targetPath: '$(System.DefaultWorkingDirectory)'

    - task: Bash@3
      enabled: true
      displayName: 'Convert PBF to GeoParquet'
      env:
        # Hosted ubuntu agents provide 2 vCPU / 7 GB RAM. The DuckDB budget is
        # pinned explicitly so that runs stay comparable and so that DuckDB
        # leaves headroom for the GDAL OSM node cache instead of claiming 80%
        # of system memory. Capping threads also caps the number of concurrent
        # sort partitions, and with it peak scratch disk usage.
        DUCKDB_MEMORY_LIMIT: '5GB'
        DUCKDB_THREADS: '2'
        RESOURCE_LOG: '$(System.DefaultWorkingDirectory)/resource-log-$(COUNTRY_CODE)-$(OSM_REGION).csv'
        RESOURCE_INTERVAL: '15'
      inputs:
        targetType: 'inline'
        script: |
          set -e

          ADDRESSES_PBF="$(COUNTRY_CODE)_$(OSM_REGION).addresses.pbf"
          ROADS_PBF="$(COUNTRY_CODE)_$(OSM_REGION).roads.pbf"
          ENTRANCES_PBF="$(COUNTRY_CODE)_$(OSM_REGION).entrances.pbf"
          WATERWAYS_PBF="$(COUNTRY_CODE)_$(OSM_REGION).waterways.pbf"
          OUTPUT_PARQUET="$(COUNTRY_CODE)_$(OSM_REGION).addresses.parquet"
          SKIP_OSMIUM="${{ parameters.skipOsmiumFilter }}"

          if [ "$SKIP_OSMIUM" = "false" ] || [ "$SKIP_OSMIUM" = "False" ]; then
            FOUND_PBF=$(find . -name "$(OSM_REGION).osm.pbf" 2>/dev/null | head -n 1)
            if [ -n "$FOUND_PBF" ] && [ -f "$FOUND_PBF" ]; then
              INPUT_PBF="$FOUND_PBF"
            else
              INPUT_PBF="osm-data-$(OSM_REGION)/$(OSM_REGION).osm.pbf"
            fi

            if [ ! -f "$INPUT_PBF" ]; then
              echo "****************************************************************"
              echo " ERROR: Missing PBF file for region '$(OSM_REGION)'!"
              echo ""
              echo " File '$(OSM_REGION).osm.pbf' was not found in workspace."
              echo ""
              echo " Cause:"
              echo "   The osm-download pipeline (definition 3) has not cached"
              echo "   the PBF artifact for '$(OSM_REGION)', or the artifact expired."
              echo ""
              echo " Solution:"
              echo "   Run the osm-download pipeline (definition 3) first to"
              echo "   populate cached PBF artifacts for '$(OSM_REGION)'."
              echo "****************************************************************"
              exit 1
            fi

            echo "[INFO] Found input PBF: $INPUT_PBF"
            echo "[INFO] Filtering address features via osmium..."
            osmium tags-filter "$INPUT_PBF" \
              n/addr:housenumber wr/addr:housenumber \
              -o "$ADDRESSES_PBF" --overwrite

            echo "[INFO] Filtering road features via osmium..."
            osmium tags-filter "$INPUT_PBF" \
              w/highway=residential,unclassified,tertiary,tertiary_link,secondary,secondary_link,primary,primary_link,trunk,trunk_link,living_street,service,pedestrian,track,path,footway,cycleway \
              -o "$ROADS_PBF" --overwrite

            echo "[INFO] Filtering entrance features via osmium..."
            osmium tags-filter "$INPUT_PBF" \
              n/entrance n/barrier=gate,lift_gate \
              -o "$ENTRANCES_PBF" --overwrite

            echo "[INFO] Filtering waterway features via osmium..."
            osmium tags-filter "$INPUT_PBF" \
              wr/waterway=river,canal,stream r/type=waterway \
              -o "$WATERWAYS_PBF" --overwrite

            mkdir -p "pbf-$(COUNTRY_CODE)-$(OSM_REGION)"
            cp "$ADDRESSES_PBF" "$ROADS_PBF" "$ENTRANCES_PBF" "$WATERWAYS_PBF" "pbf-$(COUNTRY_CODE)-$(OSM_REGION)/"

            echo "[INFO] Reclaiming disk space: removing raw input PBF immediately..."
            rm -rf "osm-data-$(OSM_REGION)" "$(OSM_REGION).osm.pbf"
          else
            echo "[INFO] Skipping Osmium filter stage (using pre-filtered PBF artifacts)."
            for PBF_NAME in "$ADDRESSES_PBF" "$ROADS_PBF" "$ENTRANCES_PBF" "$WATERWAYS_PBF"; do
              if [ ! -f "$PBF_NAME" ]; then
                FOUND=$(find . -name "$PBF_NAME" 2>/dev/null | head -n 1)
                if [ -n "$FOUND" ] && [ -f "$FOUND" ]; then
                  mv "$FOUND" .
                fi
              fi
              if [ ! -f "$PBF_NAME" ]; then
                echo "****************************************************************"
                echo " ERROR: Pre-filtered PBF file '$PBF_NAME' not found!"
                echo "****************************************************************"
                exit 1
              fi
            done
          fi

          echo "[INFO] Converting filtered PBFs to GeoParquet via DuckDB..."
          chmod +x scripts/convert.sh
          ./scripts/convert.sh "$ADDRESSES_PBF" "$ROADS_PBF" "$ENTRANCES_PBF" "$WATERWAYS_PBF" "$OUTPUT_PARQUET" "$(COUNTRY_CODE)"

          echo "[INFO] Validating output GeoParquet files..."
          python3 scripts/validate_parquet.py "$(COUNTRY_CODE)_$(OSM_REGION)".*.parquet --fail-on-error

          # Partition oversized files while this country is the only dataset on disk.
          # The release pipeline aggregates only already publishable assets.
          python3 scripts/split_oversized_parquet.py . --max-size-mb 1800

          echo "[INFO] Validating publishable GeoParquet files after partitioning..."
          python3 scripts/validate_parquet.py "$(COUNTRY_CODE)_$(OSM_REGION)".*.parquet --fail-on-error

          mkdir -p "artifacts-$(COUNTRY_CODE)-$(OSM_REGION)"
          cp "$(COUNTRY_CODE)_$(OSM_REGION)".*.parquet "artifacts-$(COUNTRY_CODE)-$(OSM_REGION)/"

          mkdir -p "pbf-$(COUNTRY_CODE)-$(OSM_REGION)"
          cp "$ADDRESSES_PBF" "$ROADS_PBF" "$ENTRANCES_PBF" "$WATERWAYS_PBF" "pbf-$(COUNTRY_CODE)-$(OSM_REGION)/" 2>/dev/null || true

    # The filtered PBFs are the expensive intermediate (after long osmium passes).
    # Retaining them lets a re-run with skipOsmiumFilter=true jump straight to the
    # export stage. Safe to publish unconditionally: this artifact feeds re-runs
    # of this pipeline only, never the release pipeline's aggregation.
    - ${{ if eq(parameters.skipOsmiumFilter, false) }}:
      - task: PublishPipelineArtifact@1
        enabled: true
        displayName: 'Publish pre-filtered PBF artifacts'
        condition: always()
        # The PBFs are absent when the osmium stage itself failed; a missing path
        # must not mask the original error.
        continueOnError: true
        inputs:
          targetPath: 'pbf-$(COUNTRY_CODE)-$(OSM_REGION)'
          artifact: 'osm-pbf-$(COUNTRY_CODE)-$(OSM_REGION)'
          publishLocation: 'pipeline'

    # Deliberately left on the default succeeded() condition: the release
    # pipeline aggregates these per-region artifacts, so publishing a partial
    # layer set would let an incomplete dataset reach a release.
    - task: PublishPipelineArtifact@1
      enabled: true
      displayName: 'Publish GeoParquet artifacts (addresses, roads, entrances, waterways)'
      inputs:
        targetPath: 'artifacts-$(COUNTRY_CODE)-$(OSM_REGION)'
        artifact: 'osm-parquet-$(COUNTRY_CODE)-$(OSM_REGION)'
        publishLocation: 'pipeline'

    # Must stay ahead of the cleanup step below, which wipes the working
    # directory unconditionally. Without this the resource log is destroyed on
    # every run that does not take the agent offline outright, so the peak
    # memory and scratch figures never reach anyone.
    - task: PublishPipelineArtifact@1
      enabled: true
      displayName: 'Publish resource log'
      condition: always()
      continueOnError: true
      inputs:
        targetPath: '$(System.DefaultWorkingDirectory)/resource-log-$(COUNTRY_CODE)-$(OSM_REGION).csv'
        artifact: 'resource-log-$(COUNTRY_CODE)-$(OSM_REGION)'
        publishLocation: 'pipeline'

    - task: Bash@3
      displayName: 'Cleanup workspace'
      condition: always()
      inputs:
        targetType: 'inline'
        script: |
          rm -rf $(System.DefaultWorkingDirectory)/*

# ---------------------------------------------------------------------------
# Stage 4: Publish GitHub Release (optional, driven by parameter)
# ---------------------------------------------------------------------------
- stage: release
  displayName: 'Publish GitHub Release'
  dependsOn: convert
  condition: and(succeeded('convert'), ${{ eq(parameters.publishGitHubRelease, true) }})
  jobs:
  # Job 1: Initialize release record with metadata and release notes
  - job: init_release
    displayName: 'Initialize GitHub Release'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - checkout: self

    - task: Bash@3
      name: init_vars
      displayName: 'Resolve Release Metadata & Generate Notes'
      env:
        PARAM_RELEASE_TAG: '${{ parameters.releaseTag }}'
        PARAM_RELEASE_TITLE: '${{ parameters.releaseTitle }}'
      inputs:
        targetType: 'inline'
        script: |
          set -e

          RELEASE_TAG="$PARAM_RELEASE_TAG"
          if [ "$RELEASE_TAG" = "auto" ] || [ -z "$RELEASE_TAG" ]; then
            RELEASE_TAG="$(Build.BuildNumber)"
          fi

          RELEASE_TITLE="$PARAM_RELEASE_TITLE"
          if [ "$RELEASE_TITLE" = "auto" ] || [ -z "$RELEASE_TITLE" ]; then
            RELEASE_TITLE="Release $RELEASE_TAG"
          fi

          echo "[INFO] Release Tag  : $RELEASE_TAG"
          echo "[INFO] Release Title: $RELEASE_TITLE"

          echo "##vso[task.setvariable variable=RELEASE_TAG;isOutput=true]$RELEASE_TAG"
          echo "##vso[task.setvariable variable=RELEASE_TITLE;isOutput=true]$RELEASE_TITLE"

          cat <<EOF > release-notes.md
          ## OSM GeoParquet Release ($RELEASE_TAG)

          Global ZSTD-compressed GeoParquet datasets containing address points, drivable road centerlines, entrance/access nodes, and linear waterways extracted from OpenStreetMap.

          ### Datasets & Schemas

          #### 1. Address Points (\`<CC>_<region>.addresses.parquet\`)
          | Column | Type | Description |
          | :--- | :--- | :--- |
          | **\`street\`** | \`VARCHAR\` | Street name (\`addr:street\` or \`addr:place\`) |
          | **\`number\`** | \`VARCHAR\` | House number (\`addr:housenumber\`) |
          | **\`postcode\`** | \`VARCHAR\` | Postal code (\`addr:postcode\`) |
          | **\`city\`** | \`VARCHAR\` | City / Municipality (\`addr:city\`) |
          | **\`geometry\`** | \`GEOMETRY\` | Point geometry (WGS84 EPSG:4326, Hilbert-sorted) |
          | **\`osm_type\`** | \`VARCHAR\` | Source OSM element type (\`node\`, \`way\`, \`relation\`) |
          | **\`osm_id\`** | \`BIGINT\` | Source OSM element ID |

          #### 2. Road Centerlines (\`<CC>_<region>.roads.parquet\`)
          | Column | Type | Description |
          | :--- | :--- | :--- |
          | **\`osm_id\`** | \`BIGINT\` | Source OSM Way ID |
          | **\`osm_type\`** | \`VARCHAR\` | Element type (\`way\`) |
          | **\`name\`** | \`VARCHAR\` | Street name (\`name\` tag) |
          | **\`highway\`** | \`VARCHAR\` | Highway classification (\`residential\`, \`primary\`, \`service\`, etc.) |
          | **\`oneway\`** | \`VARCHAR\` | Normalized oneway flag (\`yes\`, \`no\`, \`-1\`) |
          | **\`service\`** | \`VARCHAR\` | Subtype for service roads (\`driveway\`, \`alley\`, etc.) |
          | **\`geometry\`** | \`GEOMETRY\` | LineString geometry (WGS84 EPSG:4326, Hilbert-sorted) |

          #### 3. Entrances & Access Gates (\`<CC>_<region>.entrances.parquet\`)
          | Column | Type | Description |
          | :--- | :--- | :--- |
          | **\`osm_id\`** | \`BIGINT\` | Source OSM Node ID |
          | **\`osm_type\`** | \`VARCHAR\` | Element type (\`node\`) |
          | **\`name\`** | \`VARCHAR\` | Entrance name |
          | **\`ref\`** | \`VARCHAR\` | Staircase / door reference code |
          | **\`entrance\`** | \`VARCHAR\` | Entrance classification (\`main\`, \`yes\`, \`staircase\`, etc.) |
          | **\`barrier\`** | \`VARCHAR\` | Barrier tag value for gates/access points (\`gate\`, \`lift_gate\`) |
          | **\`street\`** | \`VARCHAR\` | Street name at entrance |
          | **\`housenumber\`** | \`VARCHAR\` | House number at entrance |
          | **\`geometry\`** | \`GEOMETRY\` | Point geometry (WGS84 EPSG:4326, Hilbert-sorted) |

          #### 4. Linear Waterways (\`<CC>_<region>.waterways.parquet\`)
          | Column | Type | Description |
          | :--- | :--- | :--- |
          | **\`osm_id\`** | \`BIGINT\` | Source OSM Way ID |
          | **\`osm_type\`** | \`VARCHAR\` | Element type (\`way\`) |
          | **\`name\`** | \`VARCHAR\` | Waterway name (\`name\` tag, coalesced from way or relation) |
          | **\`waterway\`** | \`VARCHAR\` | Waterway classification (\`river\`, \`canal\`, \`stream\`) |
          | **\`relation_id\`** | \`BIGINT\` | Parent waterway relation ID (e.g. \`89652\` for Danube) or \`NULL\` |
          | **\`member_role\`** | \`VARCHAR\` | Role in parent relation (e.g. \`'main_stream'\`, \`'side_stream'\`) or \`NULL\` |
          | **\`alt_names\`** | \`MAP(VARCHAR, VARCHAR)\` | Localized & alternative names (\`en\`, \`de\`, \`alt_name\`, etc.) |
          | **\`tags\`** | \`MAP(VARCHAR, VARCHAR)\` | Complete raw OSM tags map (merged from way and parent relation) |
          | **\`geometry\`** | \`GEOMETRY\` | LineString geometry (WGS84 EPSG:4326, Hilbert-sorted) |

          ### Download Assets
          Over 700 GeoParquet datasets covering 169 countries and territories worldwide:
          - **\`<CC>_<region>.addresses.parquet\`**: Address points
          - **\`<CC>_<region>.roads.parquet\`**: Drivable road centerlines (partitioned into \`.part<N>.parquet\` where raw size exceeds GitHub's 2 GiB limit)
          - **\`<CC>_<region>.entrances.parquet\`**: Entrance nodes & gates
          - **\`<CC>_<region>.waterways.parquet\`**: Linear waterways

          ---
          *Built with DuckDB spatial extension and ZSTD compression. Spatially indexed using Hilbert curve ordering.*
          EOF

          cat release-notes.md

    - task: PublishPipelineArtifact@1
      displayName: 'Publish release notes'
      inputs:
        targetPath: '$(System.DefaultWorkingDirectory)/release-notes.md'
        artifact: 'release-notes'
        publishLocation: 'pipeline'

    - task: GitHubRelease@1
      displayName: 'Create Initial GitHub Release'
      inputs:
        gitHubConnection: '3c34db30-d57b-42e2-a970-857bd932c6c0'
        repositoryName: '$(Build.Repository.Name)'
        action: 'create'
        target: '$(Build.SourceVersion)'
        tagSource: 'userSpecifiedTag'
        tag: '$(init_vars.RELEASE_TAG)'
        title: '$(init_vars.RELEASE_TITLE)'
        releaseNotesSource: 'filePath'
        releaseNotesFilePath: '$(System.DefaultWorkingDirectory)/release-notes.md'
        assetUploadMode: 'replace'
        isDraft: ${{ parameters.isDraft }}
        isPreRelease: ${{ parameters.isPreRelease }}

  # Job 2: Upload assets partitioned by geographical continent/region
  - job: upload_assets
    displayName: 'Upload Assets'
    dependsOn: init_release
    condition: succeeded('init_release')
    timeoutInMinutes: 360
    pool:
      vmImage: 'ubuntu-latest'
    variables:
      RELEASE_TAG: $[ dependencies.init_release.outputs['init_vars.RELEASE_TAG'] ]
    strategy:
      maxParallel: 6
      matrix:
        europe:
          REGION_GROUP: 'Europe'
          ARTIFACT_PATTERNS: |
            osm-parquet-AD-andorra/**
            osm-parquet-AL-albania/**
            osm-parquet-AT-austria/**
            osm-parquet-BA-bosnia-herzegovina/**
            osm-parquet-BE-belgium/**
            osm-parquet-BG-bulgaria/**
            osm-parquet-BY-belarus/**
            osm-parquet-CH-switzerland/**
            osm-parquet-CY-cyprus/**
            osm-parquet-CZ-czech-republic/**
            osm-parquet-DE-germany/**
            osm-parquet-DK-denmark/**
            osm-parquet-EE-estonia/**
            osm-parquet-ES-spain/**
            osm-parquet-FI-finland/**
            osm-parquet-FO-faroe-islands/**
            osm-parquet-FR-france/**
            osm-parquet-GB-great-britain/**
            osm-parquet-GE-georgia/**
            osm-parquet-GF-guyane/**
            osm-parquet-GP-guadeloupe/**
            osm-parquet-GR-greece/**
            osm-parquet-HR-croatia/**
            osm-parquet-HU-hungary/**
            osm-parquet-IE-ireland-and-northern-ireland/**
            osm-parquet-IM-isle-of-man/**
            osm-parquet-IS-iceland/**
            osm-parquet-IT-italy/**
            osm-parquet-LI-liechtenstein/**
            osm-parquet-LT-lithuania/**
            osm-parquet-LU-luxembourg/**
            osm-parquet-LV-latvia/**
            osm-parquet-MC-monaco/**
            osm-parquet-MD-moldova/**
            osm-parquet-ME-montenegro/**
            osm-parquet-MK-macedonia/**
            osm-parquet-MQ-martinique/**
            osm-parquet-MT-malta/**
            osm-parquet-NL-netherlands/**
            osm-parquet-NO-norway/**
            osm-parquet-PL-poland/**
            osm-parquet-PT-azores/**
            osm-parquet-PT-portugal/**
            osm-parquet-RE-reunion/**
            osm-parquet-RO-romania/**
            osm-parquet-RS-serbia/**
            osm-parquet-SE-sweden/**
            osm-parquet-SI-slovenia/**
            osm-parquet-SK-slovakia/**
            osm-parquet-TR-turkey/**
            osm-parquet-UA-ukraine/**
            osm-parquet-XK-kosovo/**
            osm-parquet-YT-mayotte/**
        north_america:
          REGION_GROUP: 'North America'
          ARTIFACT_PATTERNS: |
            osm-parquet-CA-canada/**
            osm-parquet-GL-greenland/**
            osm-parquet-MX-mexico/**
            osm-parquet-PR-puerto-rico/**
            osm-parquet-US-us/**
            osm-parquet-VI-us-virgin-islands/**
        south_central_america:
          REGION_GROUP: 'South & Central America'
          ARTIFACT_PATTERNS: |
            osm-parquet-AR-argentina/**
            osm-parquet-BO-bolivia/**
            osm-parquet-BR-brazil/**
            osm-parquet-BS-bahamas/**
            osm-parquet-BZ-belize/**
            osm-parquet-CL-chile/**
            osm-parquet-CO-colombia/**
            osm-parquet-CR-costa-rica/**
            osm-parquet-CU-cuba/**
            osm-parquet-EC-ecuador/**
            osm-parquet-GT-guatemala/**
            osm-parquet-GY-guyana/**
            osm-parquet-HN-honduras/**
            osm-parquet-HT-haiti-and-domrep/**
            osm-parquet-JM-jamaica/**
