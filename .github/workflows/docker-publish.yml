name: Build and Publish osm2parquet Container

on:
  push:
    branches:
      - main
    paths:
      - 'docker/osm2parquet/**'
      - '.github/workflows/docker-publish.yml'
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Image tag version (e.g. v1.0.9, defaults to version from azure-pipelines.yml)'
        required: false
        type: string

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine version tag
        id: meta
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            TAG="${{ inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG=$(grep -oE 'osm2parquet:v[0-9]+\.[0-9]+\.[0-9]+' azure-pipelines.yml | head -n 1 | cut -d: -f2)
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "[INFO] Using version tag: ${TAG}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub (if secrets configured)
        uses: docker/login-action@v3
        if: env.HAVE_DH == 'true'
        env:
          HAVE_DH: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare tags
        id: tags
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          TAGS="ghcr.io/${{ github.repository_owner }}/osm2parquet:${TAG}"
          if [ "${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}" = "true" ]; then
            TAGS="${TAGS},krizleebear/osm2parquet:${TAG}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: docker/osm2parquet
          file: docker/osm2parquet/Dockerfile
          platforms: linux/amd64,linux/arm64
          provenance: false
          push: true
          tags: ${{ steps.tags.outputs.tags }}
