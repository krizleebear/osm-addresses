; OGR/GDAL OSM driver configuration for DuckDB ST_Read
; Exposes addr:* tags as dedicated SQL columns for points and multipolygon layers.
; Used by export_addresses.sql via open_options=['CONFIG_FILE=/app/osmconf.ini']

[points]
attributes=name,addr:street,addr:housenumber,addr:postcode,addr:city
other_tags=yes

[multipolygons]
attributes=name,type,boundary,building,addr:street,addr:housenumber,addr:postcode,addr:city
other_tags=yes

[lines]
attributes=name
other_tags=no

[other_relations]
attributes=
other_tags=no
